name: V3 Test Evidence

on:
  pull_request:
    branches:
      - feature/product-database
      - main
  push:
    branches:
      - feature/product-database
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  JWT_SECRET_KEY: "ci-only-placeholder-not-for-production-use"

jobs:
  v3-api-suite:
    name: V3 API suite (test_server.py)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Record environment
        run: |
          python --version
          python -m pip --version
          git rev-parse HEAD

      - name: Collect V3 API tests
        run: python -m pytest --collect-only -q test_server.py

      - name: Run V3 API tests
        run: python -m pytest -q test_server.py

      - name: Verify tests did not modify tracked files
        if: always()
        run: git diff --exit-code

  full-repository-audit:
    name: Full repository suite audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Record environment
        run: |
          python --version
          python -m pip --version
          git rev-parse HEAD

      - name: Collect complete repository test suite
        run: python -m pytest --collect-only -q

      - name: Run complete repository test suite
        run: python -m pytest -q

      - name: Verify tests did not modify tracked files
        if: always()
        run: git diff --exit-code
