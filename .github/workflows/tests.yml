name: Release Test Evidence

on:
  pull_request:
    branches:
      - feature/product-database
      - main
  push:
    branches:
      - feature/product-database
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  JWT_SECRET_KEY: "ci-only-placeholder-not-for-production-use"

jobs:
  v3-release-suite:
    name: Release suite (test_server.py)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Record environment
        run: |
          python --version
          python -m pip --version
          git rev-parse HEAD

      - name: Collect canonical tests
        run: python -m pytest --collect-only -q test_server.py

      - name: Run canonical tests
        run: python -m pytest -q test_server.py

      - name: Verify tests did not modify tracked files
        if: always()
        run: git diff --exit-code

  legacy-practical-audit:
    name: Legacy Practical 8 mock audit (non-release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Record environment
        run: |
          python --version
          python -m pip --version
          git rev-parse HEAD

      - name: Explain audit boundary
        run: |
          echo "test_mock.py is retained as historical Practical 8, Task 7 evidence."
          echo "It targets the removed V2 Pandas/raw-SQLite contract and is not the V3 release suite."

      - name: Collect historical mock tests
        run: python -m pytest --collect-only -q test_mock.py

      - name: Run historical compatibility audit
        run: python -m pytest -q test_mock.py

      - name: Verify audit did not modify tracked files
        if: always()
        run: git diff --exit-code
